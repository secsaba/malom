name: CI

# Every check runs inside the flake's dev shell, so CI uses the same Node and
# pnpm as a developer's machine rather than whatever the runner ships with.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      # ADR-0002's boundary is enforced here: this step fails the build when
      # engine or search code imports React, the DOM, or the strings module.
      - name: Lint
        run: nix develop --command pnpm lint

      - name: Typecheck
        run: nix develop --command pnpm typecheck

      - name: Fast suite
        run: nix develop --command pnpm test

      - name: Build
        run: nix develop --command pnpm build

      - name: Install the browser
        run: nix develop --command pnpm exec playwright install --with-deps chromium

      - name: Browser suite
        run: nix develop --command pnpm e2e

      - name: Keep the browser suite's report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Package the site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
